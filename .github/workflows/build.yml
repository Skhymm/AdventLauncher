- name: Build exe
        run: npx electron-builder --win nsis portable --publish never

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install

      - name: Build exe
        run: npx electron-builder --win nsis portable

      - uses: actions/upload-artifact@v4
        with:
          name: RLauncher-windows
          path: dist/*.exe
